# A cada commit na branch principal: roda os testes, gera o instalador para Windows e publica uma release nova.
#
# Versão da release = MAIOR.MENOR (de downverse/__init__.py) + número desta execução. Ex.: 0.1.37.
# Para subir a versão maior ou menor, mude __version__ em downverse/__init__.py.
# Para commitar sem gerar release, escreva [skip release] na mensagem do commit.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    name: Versão
    if: github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[skip release]')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          base=$(sed -nE 's/^__version__ = "([0-9]+\.[0-9]+).*/\1/p' downverse/__init__.py)
          test -n "$base" || { echo "::error::__version__ não encontrada em downverse/__init__.py"; exit 1; }
          echo "version=${base}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

  test:
    name: Testes
    if: github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[skip release]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q

  build:
    name: Instalador (Windows)
    needs: [version, test]
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Gravar a versão no código
        shell: python
        run: |
          import os, pathlib, re
          path = pathlib.Path("downverse/__init__.py")
          text = re.sub(r'__version__ = ".*"', f'__version__ = "{os.environ["VERSION"]}"', path.read_text(encoding="utf-8"))
          path.write_text(text, encoding="utf-8")

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Conferir a versão
        run: |
          $out = python -m downverse --version
          if ($out -ne "Downverse $env:VERSION") { throw "Versão inesperada: $out" }

      - name: Gerar o executável
        run: python -m PyInstaller --noconfirm --clean packaging/downverse.spec

      - name: Testar o executável
        run: |
          if (-not (Test-Path dist/Downverse/Downverse.exe)) { throw "Downverse.exe não foi gerado" }
          $env:DOWNVERSE_HOME = Join-Path $env:RUNNER_TEMP "downverse-smoke"
          $proc = Start-Process -FilePath "dist/Downverse/Downverse.exe" -ArgumentList "gui", "--browser", "--port", "8799" -PassThru
          try {
            $ok = $false
            for ($i = 0; $i -lt 30 -and -not $ok; $i++) {
              Start-Sleep -Seconds 1
              if ($proc.HasExited) { throw "O executável fechou sozinho (código $($proc.ExitCode))" }
              try {
                $index = Invoke-WebRequest -Uri "http://127.0.0.1:8799/" -UseBasicParsing
                $script = Invoke-WebRequest -Uri "http://127.0.0.1:8799/app.js" -UseBasicParsing
                $ok = ($index.StatusCode -eq 200) -and ($script.StatusCode -eq 200)
              } catch { }
            }
            if (-not $ok) { throw "O executável não respondeu em 30 segundos" }
          } finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }

      - name: Instalar o Inno Setup
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          if (-not (Test-Path $iscc)) { throw "Inno Setup não encontrado" }

      - name: Montar o instalador
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Qp "/DAppVersion=$env:VERSION" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "O Inno Setup falhou" }
          if (-not (Test-Path "dist/Downverse-Setup-$env:VERSION.exe")) { throw "O instalador não foi gerado" }

      - name: Compactar a versão portátil
        run: Compress-Archive -Path dist/Downverse -DestinationPath "dist/Downverse-portatil-$env:VERSION.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/Downverse-Setup-*.exe
            dist/Downverse-portatil-*.zip
          if-no-files-found: error

  release:
    name: Publicar release
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      NOTES: |
        ### Como instalar
        - **Windows:** baixe `Downverse-Setup-*.exe` abaixo e execute (não precisa de administrador).
        - **Sem instalar:** baixe `Downverse-portatil-*.zip`, extraia e abra `Downverse.exe`.
        - **Linux e macOS:** veja o README ("Usar em Linux ou macOS").

        ### O que mudou
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: assets
      - name: Criar a release
        run: |
          gh release create "v${VERSION}" assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Downverse v${VERSION}" \
            --generate-notes \
            --notes "$NOTES"
