[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "downverse"
dynamic = ["version"]
description = "Baixe VODs do Weverse com legendas e thumbnails, organizados por artista e data."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "yt-dlp[default]>=2026.10.26",
    "imageio-ffmpeg>=0.5.1",
]

[project.optional-dependencies]
desktop = ["pywebview>=5.3"]
dev = ["pytest>=8"]

[project.scripts]
downverse = "downverse.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "downverse.__version__" }

[tool.setuptools.packages.find]
include = ["downverse*"]

[tool.setuptools.package-data]
downverse = ["ui/*", "ui/fonts/*", "ui/img/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
